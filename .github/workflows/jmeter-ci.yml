name: Metrics Stack Health Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics-check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq docker-compose
          echo "✅ Prerequisites installed"

      - name: Start Metrics Stack (cAdvisor + Prometheus + Grafana)
        run: |
          cat <<EOF > prometheus.yml
          global:
            scrape_interval: 5s
          scrape_configs:
            - job_name: 'cadvisor'
              static_configs:
                - targets: ['cadvisor:8080']
          EOF

          cat <<EOF > docker-compose.yml
          version: '3.9'
          services:
            cadvisor:
              image: gcr.io/cadvisor/cadvisor:latest
              privileged: true
              ports:
                - "8080:8080"
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:rw
                - /sys:/sys:ro
                - /var/lib/docker/:/var/lib/docker:ro

            prometheus:
              image: prom/prometheus:latest
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml

            grafana:
              image: grafana/grafana:latest
              environment:
                GF_SECURITY_ADMIN_PASSWORD: admin
              ports:
                - "3000:3000"
          EOF

          docker-compose up -d
          echo "Waiting 20s for services..."
          sleep 20

      - name: Wait for services
        run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8080/metrics > /dev/null && \
               curl -s -f http://localhost:9090/metrics > /dev/null && \
               curl -s -f http://localhost:3000/api/health > /dev/null; then
              echo "✅ All services are up!"
              break
            fi
            echo "Waiting for services..."
            sleep 5
          done

      - name: Check Prometheus target
        run: |
          TARGET_STATUS=$(curl -s http://localhost:9090/api/v1/targets | jq -r '.data.activeTargets[] | select(.labels.job=="cadvisor") | .health')
          echo "Prometheus target cadvisor status: $TARGET_STATUS"

      - name: Test Prometheus metrics
        run: |
          for metric in container_cpu_usage_seconds_total container_memory_usage_bytes container_network_receive_bytes_total container_network_transmit_bytes_total; do
            COUNT=$(curl -s "http://localhost:9090/api/v1/query?query=$metric" | jq '.data.result | length')
            echo "Metric $metric: $COUNT data points"
          done

      - name: Import Grafana Dashboard
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -u admin:admin \
            -d @grafana-dashboard.json \
            http://localhost:3000/api/dashboards/db \
            | jq '.'

      - name: Create Grafana Snapshot
        run: |
          SNAPSHOT_URL=$(curl -s -u admin:admin \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"dashboard":{"uid":"cadvisor"},"name":"cadvisor-snapshot","expires":3600}' \
            http://localhost:3000/api/snapshots | jq -r '.url')
          echo "Grafana snapshot URL: $SNAPSHOT_URL"

      - name: Save cAdvisor metrics
        run: |
          curl -s http://localhost:8080/metrics > cadvisor_metrics.txt
          echo "✅ cAdvisor metrics saved"
          
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Metrics-Reports
          path: |
            cadvisor_metrics.txt

name: JMeter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash  # ensure all steps use bash

jobs:
  jmeter-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip openjdk-17-jre-headless docker.io

      - name: Start HTTPBin service (with fallback)
        run: |
          echo "Attempting to start httpbin via GitHub service container..."
          docker run -d --name httpbin -p 91:80 kennethreitz/httpbin || echo "Docker start failed"

          echo "Waiting for HTTPBin..."
          for i in {1..10}; do
            if curl -s http://localhost:91/get > /dev/null; then
              echo "✅ HTTPBin is up!"
              break
            fi
            echo "HTTPBin not ready yet... retrying ($i/10)"
            sleep 3
          done

          # Fallback if container didn't start
          if ! curl -s http://localhost:91/get > /dev/null; then
            echo "⚠️ Service not detected, starting manually..."
            docker rm -f httpbin || true
            docker run -d --name httpbin -p 91:80 kennethreitz/httpbin
            sleep 5
            curl -v http://localhost:91/get || (echo "❌ HTTPBin failed to start" && exit 1)
          fi

      - name: Install JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip -q apache-jmeter-5.6.3.zip -d /opt/
          sudo ln -s /opt/apache-jmeter-5.6.3/bin/jmeter /usr/local/bin/jmeter
          jmeter -v

      - name: Run JMeter Test
        run: |
          mkdir -p /tmp/results
          jmeter -n -t ./P01_HTTPBinAPI_PT_StreeTest.jmx \
                 -l /tmp/results/results.jtl \
                 -e -o /tmp/results/report

      - name: Upload JMeter Report
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-Report
          path: /tmp/results/report

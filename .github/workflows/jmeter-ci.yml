name: JMeter CI/CD 
on: 
  push: 
    branches: 
      - main
  pull_request: 
  workflow_dispatch:
  
jobs:
  start-httpbin:
    runs-on: ubuntu-22.04
    services:
      httpbin:
        image: kennethreitz/httpbin
        ports:
          - 91:80
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for httpbin to start
        shell: bash
        run: |
            sudo apt update
            sudo apt install -y curl
            echo "Waiting for httpbin service..."
            for i in {1..10}; do
              curl -s http://localhost:91/get && break
              echo "HTTPBin not ready yet... retrying ($i/10)"
              sleep 3
            done

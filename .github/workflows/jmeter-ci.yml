name: JMeter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash  # ensures all steps use bash (avoids exit code 127)

jobs:
  jmeter-test:
    runs-on: ubuntu-22.04

    services:
      httpbin:
        image: kennethreitz/httpbin
        ports:
          - 91:80

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip openjdk-17-jre-headless
          echo "✅ Prerequisites installed"

      - name: Wait for HTTPBin service
        run: |
          echo "Waiting for httpbin service to start..."
          for i in {1..10}; do
            if curl -s http://localhost:91/get > /dev/null; then
              echo "✅ HTTPBin is up!"
              break
            fi
            echo "HTTPBin not ready yet... retrying ($i/10)"
            sleep 3
          done

          # Final check
          if ! curl -s http://localhost:91/get > /dev/null; then
            echo "⚠️ HTTPBin service not responding, trying manual start..."
            docker rm -f httpbin || true
            docker run -d --name httpbin -p 91:80 kennethreitz/httpbin
            sleep 5
            curl -v http://localhost:91/get || (echo "❌ HTTPBin failed to start" && exit 1)
          fi

      - name: Install JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip -q apache-jmeter-5.6.3.zip -d /opt/
          sudo ln -sf /opt/apache-jmeter-5.6.3/bin/jmeter /usr/local/bin/jmeter
          jmeter -v

      - name: Run JMeter Test
        run: |
          mkdir -p /tmp/results
          jmeter -n -t ./P01_HTTPBinAPI_PT_StreeTest.jmx \
                 -l /tmp/results/results.jtl \
                 -e -o /tmp/results/report
          echo "✅ JMeter test completed"

      - name: Upload JMeter Report
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-Report
          path: /tmp/results/report
